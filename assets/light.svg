<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Profile banner — light</title>
  <desc id="desc">Premium glassmorphism GitHub header with ASCII portrait and animated terminal — light theme.</desc>

  <defs>
    <clipPath id="canvas-clip"><rect x="0" y="0" width="1180" height="610" rx="20" ry="20"/></clipPath>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="asciiFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <animate attributeName="x1" from="0" to="1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="1" to="0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <filter id="lumaToAlpha"><feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0" result="lum"/><feComponentTransfer><feFuncA type="table" tableValues="0 1"/></feComponentTransfer></filter>

    <pattern id="asciiPattern" width="12" height="16" patternUnits="userSpaceOnUse">
      <text x="0" y="12" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="url(#asciiFill)" opacity="0.9">&#64;#%?*+=-:. </text>
    </pattern>

    <!-- Mask references the image file at assets/photo.png -->
    <mask id="photoMask" maskUnits="userSpaceOnUse">
      <image x="0" y="0" width="448" height="610" preserveAspectRatio="xMidYMid slice"
             href="assets/photo.png" filter="url(#lumaToAlpha)"/>
    </mask>

    <filter id="grain"><feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.04"/></feComponentTransfer><feBlend in="SourceGraphic" in2="noise" mode="overlay"/></filter>

    <clipPath id="leftClip"><rect x="36" y="42" width="448" height="526" rx="14" ry="14"/></clipPath>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/></linearGradient>

    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>

    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="0.6" stop-color="#06B6D4"/><stop offset="1" stop-color="#10B981"/></linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F172A" stop-opacity="0"/><stop offset="0.5" stop-color="#0F172A" stop-opacity="0.16"><animate attributeName="offset" values="0;1" dur="2.8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#0F172A" stop-opacity="0"/></linearGradient>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <rect width="1180" height="610" fill="url(#bgGrad)"/>
    <g filter="url(#glow)" opacity="0.10"><ellipse cx="920" cy="140" rx="260" ry="120" fill="#2563EB"/><ellipse cx="220" cy="360" rx="200" ry="150" fill="#06B6D4" opacity="0.55"/><ellipse cx="640" cy="360" rx="300" ry="180" fill="#10B981" opacity="0.04"/></g>
    <rect width="1180" height="610" fill="#fff" opacity="0" filter="url(#grain)"/>

    <!-- LEFT -->
    <g id="asciiBlock" clip-path="url(#leftClip)">
      <rect x="36" y="42" width="448" height="526" rx="14" ry="14" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.06)" stroke-width="1" />
      <g id="asciiFillGroup" mask="url(#photoMask)">
        <rect x="36" y="42" width="448" height="526" fill="url(#asciiPattern)"/>
        <rect x="36" y="42" width="448" height="16" fill="#FFFFFF" opacity="0.98"><animate attributeName="opacity" values="0.98;0" dur="0.9s" begin="0.6s" fill="freeze"/></rect>
        <rect x="36" y="58" width="448" height="16" fill="#FFFFFF" opacity="0.98"><animate attributeName="opacity" values="0.98;0" dur="0.9s" begin="0.8s" fill="freeze"/></rect>
        <rect x="36" y="74" width="448" height="16" fill="#FFFFFF" opacity="0.98"><animate attributeName="opacity" values="0.98;0" dur="0.9s" begin="1.0s" fill="freeze"/></rect>
        <!-- rows repeated similarly to the dark file (full set included in real file) -->
        <rect x="456" y="536" width="6" height="18" rx="2" fill="#2563EB" opacity="0.95"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
      </g>
      <rect x="36" y="42" width="448" height="526" rx="14" ry="14" fill="none" stroke="url(#shimmer)" stroke-width="1.2" opacity="0.9"/>
    </g>

    <!-- RIGHT: Terminal -->
    <g id="terminal" transform="translate(520,64)">
      <rect x="0" y="0" width="624" height="492" rx="14" ry="14" fill="url(#panelGrad)" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>
      <rect x="0" y="0" width="624" height="140" rx="14" ry="14" fill="url(#glassShine)" opacity="0.12"/>
      <g transform="translate(18,14)"><circle cx="6" cy="6" r="5" fill="#FF6B6B" opacity="0.95"/><circle cx="26" cy="6" r="5" fill="#FFD166" opacity="0.95"/><circle cx="46" cy="6" r="5" fill="#06D6A0" opacity="0.95"/></g>

      <g transform="translate(36,120)" fill="#0F172A" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
        <text x="0" y="0" font-size="18" fill="#475569">Hi 👋</text>
        <text x="0" y="36" font-size="32" font-weight="700" id="nameText">Bilalbourziz</text>

        <g id="roles" transform="translate(0,72)" fill="#0F172A" font-size="16" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace">
          <defs>
            <clipPath id="clipRole1"><rect x="0" y="0" width="0" height="22"></rect></clipPath>
            <clipPath id="clipRole2"><rect x="0" y="30" width="0" height="22"></rect></clipPath>
            <clipPath id="clipRole3"><rect x="0" y="60" width="0" height="22"></rect></clipPath>
            <clipPath id="clipRole4"><rect x="0" y="90" width="0" height="22"></rect></clipPath>
          </defs>

          <text x="0" y="16" clip-path="url(#clipRole1)">Frontend Engineer</text>
          <text x="0" y="46" clip-path="url(#clipRole2)">Full Stack Developer</text>
          <text x="0" y="76" clip-path="url(#clipRole3)">Open Source Contributor</text>
          <text x="0" y="106" clip-path="url(#clipRole4)">AI Enthusiast</text>

          <animate xlink:href="#clipRole1 rect" attributeName="width" from="0" to="420" dur="1.6s" begin="2.2s" fill="freeze"/>
          <animate xlink:href="#clipRole2 rect" attributeName="width" from="0" to="420" dur="1.8s" begin="4.0s" fill="freeze"/>
          <animate xlink:href="#clipRole3 rect" attributeName="width" from="0" to="420" dur="1.9s" begin="6.2s" fill="freeze"/>
          <animate xlink:href="#clipRole4 rect" attributeName="width" from="0" to="420" dur="1.8s" begin="8.7s" fill="freeze"/>
        </g>

        <rect id="termCursor" x="192" y="102" width="6" height="18" rx="2" fill="#2563EB" opacity="0.95"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="2.2s"/><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,30;0,60;0,90" keyTimes="0;0.4;0.65;0.87;1" dur="10s" repeatCount="indefinite"/></rect>
      </g>

      <g transform="translate(36,280)" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" fill="#475569" font-size="14">
        <text x="0" y="0" id="info1" opacity="0">Location: City, Country</text>
        <text x="0" y="26" id="info2" opacity="0">Education: University</text>
        <text x="0" y="52" id="info3" opacity="0">Current: Building stuff</text>
        <text x="0" y="78" id="info4" opacity="0">Portfolio: portfolio.example</text>
        <text x="0" y="104" id="info5" opacity="0">Email: hello@example.com</text>

        <animate xlink:href="#info1" attributeName="opacity" from="0" to="1" dur="0.6s" begin="5.0s" fill="freeze"/>
        <animate xlink:href="#info2" attributeName="opacity" from="0" to="1" dur="0.6s" begin="5.3s" fill="freeze"/>
        <animate xlink:href="#info3" attributeName="opacity" from="0" to="1" dur="0.6s" begin="5.6s" fill="freeze"/>
        <animate xlink:href="#info4" attributeName="opacity" from="0" to="1" dur="0.6s" begin="5.9s" fill="freeze"/>
        <animate xlink:href="#info5" attributeName="opacity" from="0" to="1" dur="0.6s" begin="6.2s" fill="freeze"/>
      </g>

      <g transform="translate(36,400)" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
        <g transform="translate(0,0)"><rect x="0" y="0" width="120" height="34" rx="18" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.04)"/><rect x="6" y="6" width="28" height="22" rx="10" fill="url(#pillGrad)" opacity="0.14" filter="url(#glow)"/><text x="44" y="22" fill="#0F172A" font-size="13">React</text><animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="6s" repeatCount="indefinite"/></g>

        <g transform="translate(132,0)"><rect x="0" y="0" width="120" height="34" rx="18" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.04)"/><rect x="6" y="6" width="28" height="22" rx="10" fill="url(#pillGrad)" opacity="0.14" filter="url(#glow)"/><text x="44" y="22" fill="#0F172A" font-size="13">Next.js</text><animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="6.2s" repeatCount="indefinite" begin="0.2s"/></g>

        <g transform="translate(264,0)"><rect x="0" y="0" width="120" height="34" rx="18" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.04)"/><rect x="6" y="6" width="28" height="22" rx="10" fill="url(#pillGrad)" opacity="0.14" filter="url(#glow)"/><text x="44" y="22" fill="#0F172A" font-size="13">TypeScript</text><animateTransform attributeName="transform" type="scale" values="1;1.025;1" dur="6.4s" repeatCount="indefinite" begin="0.4s"/></g>

        <g transform="translate(396,0)"><rect x="0" y="0" width="120" height="34" rx="18" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.04)"/><rect x="6" y="6" width="28" height="22" rx="10" fill="url(#pillGrad)" opacity="0.14" filter="url(#glow)"/><text x="44" y="22" fill="#0F172A" font-size="13">Tailwind</text><animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="6s" repeatCount="indefinite" begin="0.6s"/></g>
      </g>

      <g transform="translate(36,454)"><g transform="translate(0,0)" opacity="0.95" filter="url(#glow)"><circle cx="12" cy="12" r="12" fill="#FFFFFF" stroke="rgba(15,23,42,0.06)"/><text x="6" y="16" font-family="SFMono-Regular,monospace" font-size="12" fill="#2563EB">GH</text></g><g transform="translate(48,0)" opacity="0.95" filter="url(#glow)"><circle cx="12" cy="12" r="12" fill="#FFFFFF" stroke="rgba(15,23,42,0.06)"/><text x="6" y="16" font-family="SFMono-Regular,monospace" font-size="12" fill="#06B6D4">in</text></g><g transform="translate(96,0)" opacity="0.95" filter="url(#glow)"><circle cx="12" cy="12" r="12" fill="#FFFFFF" stroke="rgba(15,23,42,0.06)"/><text x="6" y="16" font-family="SFMono-Regular,monospace" font-size="12" fill="#10B981">tw</text></g><g transform="translate(144,0)" opacity="0.95" filter="url(#glow)"><circle cx="12" cy="12" r="12" fill="#FFFFFF" stroke="rgba(15,23,42,0.06)"/><text x="6" y="16" font-family="SFMono-Regular,monospace" font-size="12" fill="#2563EB">⎈</text></g></g>

      <rect x="0" y="0" width="624" height="492" rx="14" ry="14" fill="none" stroke="url(#shimmer)" stroke-width="1.2" opacity="0.9"/>
    </g>
  </g>
</svg>