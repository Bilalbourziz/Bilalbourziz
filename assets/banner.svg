<svg
    width="1180"
    height="610"
    viewBox="0 0 1180 610"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-labelledby="title desc">
  <title id="title">GitHub profile banner</title>
  <desc id="desc">Background gradient with soft spotlight and decorative shapes for a profile banner.</desc>

  <defs>
    <!-- Base background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071021"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>

    <!-- Subtle radial spotlight -->
    <radialGradient id="spot" cx="0.75" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#0f3b4f" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#063038" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft blur filter for glows -->
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
    </filter>

    <!-- Small dot pattern -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#7dd3fc" opacity="0.08"/>
    </pattern>

    <!-- Slight noise / grain (very subtle) -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
    </filter>

    <!-- Mask for a smooth clipped blob -->
    <radialGradient id="blobGrad" cx="0.2" cy="0.7">
      <stop offset="0" stop-color="#1f9bd8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" fill="url(#bg)"/>

  <!-- Spotlight / radial -->
  <rect width="1180" height="610" fill="url(#spot)" opacity="0.95"/>

  <!-- Large soft blurred shapes for depth -->
  <g filter="url(#softBlur)">
    <!-- left glow -->
    <ellipse cx="220" cy="300" rx="260" ry="160" fill="#0ea5a4" opacity="0.06"/>
    <!-- right glow -->
    <ellipse cx="920" cy="180" rx="300" ry="180" fill="#7dd3fc" opacity="0.045"/>
  </g>

  <!-- Decorative clipped blob -->
  <g opacity="0.9">
    <path d="M980 60 C880 20, 760 60, 720 160 C700 210, 760 320, 860 360 C980 410, 1120 390, 1130 300 C1140 210, 1080 110, 980 60 Z"
          fill="url(#blobGrad)" opacity="0.9"/>
  </g>

  <!-- Subtle diagonal stripe band -->
  <g opacity="0.06">
    <rect x="-200" y="260" width="1400" height="120" transform="rotate(-12 0 0)" fill="#ffffff"/>
  </g>

  <!-- Dot texture overlay -->
  <rect width="1180" height="610" fill="url(#dots)" opacity="0.12" style="mix-blend-mode:overlay"/>

  <!-- Content safe area guide (invisible by default) -->
  <!-- Uncomment or change stroke to visualize the safe box for placing avatar/text -->
  <!-- <rect x="60" y="80" width="1060" height="450" rx="16" fill="none" stroke="#ffffff22" stroke-width="1"/> -->

  <!-- Very subtle grain on top for organic look -->
  <rect width="1180" height="610" fill="#000" opacity="0" filter="url(#grain)"/>

</svg>